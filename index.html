<!DOCTYPE html>
<html lang="it" class="h-full bg-[#070707]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>rungigirun - Gestione Allenamenti</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="rungigirun">
  <meta name="theme-color" content="#070707">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#070707',
              card: '#121212',
              border: '#242424',
              neon: '#FF6B00',
              neonDark: '#E05E00',
              muted: '#8E8E93',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-white font-sans antialiased bg-[#070707] flex flex-col justify-between">

  <div id="app" class="min-h-screen flex flex-col max-w-md mx-auto w-full bg-[#070707] shadow-2xl relative border-x border-[#1A1A1A]">

    <header class="sticky top-0 z-40 bg-[#070707]/90 backdrop-blur-md border-b border-brand-border px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-brand-neon flex items-center justify-center font-black text-black tracking-tighter text-xl italic shadow-[0_0_15px_rgba(255,107,0,0.4)]">
          RGR
        </div>
        <div>
          <h1 class="font-black italic tracking-wider text-lg leading-none uppercase text-white">
            RUN<span class="text-brand-neon">GIGI</span>RUN
          </h1>
          <p class="text-[10px] text-brand-muted tracking-widest uppercase font-mono mt-0.5">Istruttore Running</p>
        </div>
      </div>
      <div id="userBadge" class="hidden items-center gap-2">
        <span id="roleTag" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-brand-card border border-brand-border text-brand-neon"></span>
        <button onclick="handleLogout()" class="px-3 py-1.5 text-xs bg-brand-card border border-brand-border text-brand-muted hover:text-white rounded-lg transition font-mono">
          Esci
        </button>
      </div>
    </header>

    <main class="flex-1 p-4 pb-10">

      <!-- AUTH CONTAINER -->
      <section id="authSection" class="flex flex-col justify-center min-h-[75vh]">
        <div class="text-center mb-8">
          <h2 id="authTitle" class="text-2xl font-black uppercase italic tracking-wide">Accedi</h2>
          <p class="text-xs text-brand-muted mt-1">Gestione Allenamenti - Rungigirun</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs uppercase font-mono text-brand-muted mb-1">Email</label>
            <input type="email" id="authEmail" class="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-neon transition text-white" placeholder="atleta@rungigirun.it">
          </div>

          <div>
            <label class="block text-xs uppercase font-mono text-brand-muted mb-1">Password</label>
            <div class="relative">
              <input type="password" id="authPassword" class="w-full bg-brand-card border border-brand-border rounded-xl pl-4 pr-16 py-3 text-sm focus:outline-none focus:border-brand-neon transition text-white" placeholder="••••••••">
              <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-mono text-brand-muted hover:text-white transition py-1 px-2">
                Mostra
              </button>
            </div>
          </div>

          <!-- ROLE SELECTOR (SIGNUP ONLY) -->
          <div id="roleSelectorGroup" class="hidden space-y-3">
            <label class="block text-xs uppercase font-mono text-brand-muted mb-1">Tipo Profilo</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="userRole" value="athlete" checked onchange="handleRoleChange()" class="peer sr-only">
                <div class="p-3 text-center rounded-xl bg-brand-card border border-brand-border text-xs font-bold uppercase peer-checked:border-brand-neon peer-checked:text-brand-neon transition">
                  Atleta
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="userRole" value="coach" onchange="handleRoleChange()" class="peer sr-only">
                <div class="p-3 text-center rounded-xl bg-brand-card border border-brand-border text-xs font-bold uppercase peer-checked:border-brand-neon peer-checked:text-brand-neon transition">
                  Coach Gigi
                </div>
              </label>
            </div>

            <!-- PIN SEGRETO COACH -->
            <div id="coachPinGroup" class="hidden pt-1">
              <label class="block text-xs uppercase font-mono text-brand-neon mb-1">Codice Segreto Coach</label>
              <input type="password" id="coachPinInput" class="w-full bg-brand-card border border-brand-neon/50 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-neon transition text-white" placeholder="Inserisci il PIN Coach">
            </div>
          </div>

          <button type="button" onclick="executeDirectAuth()" class="w-full bg-brand-neon hover:bg-brand-neonDark text-black font-black uppercase py-3.5 rounded-xl transition shadow-[0_0_20px_rgba(255,107,0,0.3)] tracking-wider mt-2">
            Conferma
          </button>
        </div>

        <div class="text-center mt-6">
          <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-xs text-brand-muted hover:text-white underline font-mono">
            Non hai un account? Registrati
          </button>
        </div>
      </section>

      <!-- COACH DASHBOARD -->
      <section id="coachDashboard" class="hidden space-y-6">
        <h2 class="text-xl font-black uppercase italic">Dashboard Coach</h2>
        <div class="bg-brand-card border border-brand-border rounded-2xl p-4 space-y-4">
          <h3 class="text-xs font-mono uppercase text-brand-neon tracking-wider">Nuovo Allenamento</h3>
          <div class="space-y-3">
            <input type="email" id="workoutAthleteEmail" placeholder="Email atleta" class="w-full bg-[#070707] border border-brand-border rounded-xl px-3 py-2 text-sm text-white">
            <select id="workoutType" class="w-full bg-[#070707] border border-brand-border rounded-xl px-3 py-2 text-sm text-white">
              <option value="Ripetute">Ripetute</option>
              <option value="Fondo Lento">Fondo Lento</option>
            </select>
            <input type="date" id="workoutDate" class="w-full bg-[#070707] border border-brand-border rounded-xl px-3 py-2 text-sm text-white">
            <input type="text" id="workoutTitle" placeholder="Titolo" class="w-full bg-[#070707] border border-brand-border rounded-xl px-3 py-2 text-sm text-white">
            <textarea id="workoutDetails" placeholder="Dettagli" class="w-full bg-[#070707] border border-brand-border rounded-xl px-3 py-2 text-sm text-white"></textarea>
            <button type="button" onclick="handleCreateWorkoutDirect()" class="w-full bg-brand-neon text-black font-black uppercase py-3 rounded-xl">Invia</button>
          </div>
        </div>
        <div id="coachWorkoutsList" class="space-y-3"></div>
      </section>

      <!-- ATHLETE DASHBOARD -->
      <section id="athleteDashboard" class="hidden space-y-6">
        <h2 class="text-xl font-black uppercase italic">I Tuoi Allenamenti</h2>
        <div id="athleteWorkoutsList" class="space-y-4"></div>
      </section>

    </main>
  </div>

  <script>
    const COACH_PIN = "GIGI2026";
    const firebaseConfig = {
      apiKey: "AIzaSyD-pFIDIDdz4w5KeSOQjedmp9VLUPXfs88",
      authDomain: "rungigirun-de040.firebaseapp.com",
      projectId: "rungigirun-de040",
      storageBucket: "rungigirun-de040.firebasestorage.app",
      messagingSenderId: "443483989504",
      appId: "1:443483989504:web:a193c118ab58c5177adae5",
      measurementId: "G-T47KNG4E5J"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isSignUpMode = false;
    let currentUser = null;

    window.toggleAuthMode = function() {
      isSignUpMode = !isSignUpMode;
      const title = document.getElementById('authTitle');
      const submitBtn = document.querySelector('button[onclick="executeDirectAuth()"]');
      const toggleBtn = document.getElementById('authToggleBtn');
      const roleGroup = document.getElementById('roleSelectorGroup');

      if (isSignUpMode) {
        if (title) title.innerText = 'Registrazione';
        if (submitBtn) submitBtn.innerText = 'Registrati';
        if (toggleBtn) toggleBtn.innerText = 'Hai già un account? Accedi';
        if (roleGroup) roleGroup.classList.remove('hidden');
      } else {
        if (title) title.innerText = 'Accedi';
        if (submitBtn) submitBtn.innerText = 'Conferma';
        if (toggleBtn) toggleBtn.innerText = 'Non hai un account? Registrati';
        if (roleGroup) roleGroup.classList.add('hidden');
      }
    };

    window.togglePasswordVisibility = function() {
      const p = document.getElementById('authPassword');
      if (p) p.type = p.type === 'password' ? 'text' : 'password';
    };

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        const emailLower = (user.email || '').toLowerCase();
        let role = emailLower.includes('coach') || emailLower.includes('gigi') ? 'coach' : 'athlete';
        
        db.collection('users').doc(user.uid).get().then(doc => {
          if (doc.exists && doc.data().role) {
            showDashboard(doc.data().role);
          } else {
            showDashboard(role);
          }
        }).catch(() => {
          showDashboard(role);
        });
      } else {
        currentUser = null;
        showAuth();
      }
    });

    // FUNZIONE DIRETTA CON MESSAGGIO DI ERRORE ESPLICITO A SCHERMO
    window.executeDirectAuth = async function() {
      const email = document.getElementById('authEmail').value.trim().toLowerCase();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        alert("Inserisci email e password.");
        return;
      }

      try {
        if (isSignUpMode) {
          const roleElement = document.querySelector('input[name="userRole"]:checked');
          const role = roleElement ? roleElement.value : 'athlete';
          
          if (role === 'coach') {
            const enteredPin = document.getElementById('coachPinInput').value.trim();
            if (enteredPin !== COACH_PIN) {
              alert("PIN Coach errato!");
              return;
            }
          }

          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection('users').doc(cred.user.uid).set({
            email: email,
            role: role,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        // TI MOSTRA ESATTAMENTE COSA RISPONDE FIREBASE IN UN ALERT CHIARO
        alert("ERRORE FIREBASE [" + err.code + "]: " + err.message);
      }
    };

    window.handleLogout = function() {
      auth.signOut();
    };

    function showDashboard(role) {
      document.getElementById('authSection').classList.add('hidden');
      const badge = document.getElementById('userBadge');
      badge.classList.remove('hidden');
      badge.classList.add('flex');
      document.getElementById('roleTag').innerText = role;

      if (role === 'coach') {
        document.getElementById('coachDashboard').classList.remove('hidden');
        document.getElementById('athleteDashboard').classList.add('hidden');
        loadCoachWorkouts();
      } else {
        document.getElementById('athleteDashboard').classList.remove('hidden');
        document.getElementById('coachDashboard').classList.add('hidden');
        loadAthleteWorkouts();
      }
    }

    function showAuth() {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('coachDashboard').classList.add('hidden');
      document.getElementById('athleteDashboard').classList.add('hidden');
      document.getElementById('userBadge').classList.add('hidden');
    }

    window.handleCreateWorkoutDirect = async function() {
      try {
        await db.collection('workouts').add({
          athleteEmail: document.getElementById('workoutAthleteEmail').value.trim().toLowerCase(),
          coachUid: currentUser.uid,
          type: document.getElementById('workoutType').value,
          date: document.getElementById('workoutDate').value,
          title: document.getElementById('workoutTitle').value,
          details: document.getElementById('workoutDetails').value,
          status: 'assigned',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('Inviato!');
      } catch (err) {
        alert("Errore invio: " + err.message);
      }
    };

    function loadCoachWorkouts() {
      const container = document.getElementById('coachWorkoutsList');
      db.collection('workouts').where('coachUid', '==', currentUser.uid).onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const d = doc.data();
          html += `<div class="bg-brand-card p-3 rounded-xl border border-brand-border text-xs"><p class="text-brand-neon font-bold">${d.athleteEmail} - ${d.title}</p></div>`;
        });
        container.innerHTML = html || '<p class="text-xs text-brand-muted">Nessun allenamento.</p>';
      });
    }

    function loadAthleteWorkouts() {
      const container = document.getElementById('athleteWorkoutsList');
      const userEmail = (currentUser.email || '').toLowerCase().trim();
      db.collection('workouts').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
          const d = doc.data();
          if ((d.athleteEmail || '').toLowerCase().trim() === userEmail) {
            html += `<div class="bg-brand-card p-3 rounded-xl border border-brand-border text-xs"><p class="text-brand-neon font-bold">${d.title}</p><p class="text-gray-300">${d.details}</p></div>`;
          }
        });
        container.innerHTML = html || '<p class="text-xs text-brand-muted">Nessun allenamento assegnato.</p>';
      });
    }
  </script>
</body>
</html>
