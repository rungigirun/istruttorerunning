<!DOCTYPE html>
<html lang="it" class="h-full bg-[#070707]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>rungigirun - Gestione Allenamenti</title>
  
  <!-- iOS / Safari & Browser Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="rungigirun">
  <meta name="theme-color" content="#070707">

  <!-- Favicon Ufficiale RGR (Nero e Arancione Fluo) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23070707'/%3E%3Crect x='24' y='24' width='464' height='464' rx='96' fill='%23FF6B00'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black, Impact, sans-serif' font-weight='900' font-style='italic' font-size='210' letter-spacing='-10' fill='%23070707'%3ERGR%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23070707'/%3E%3Crect x='32' y='32' width='448' height='448' rx='96' fill='%23FF6B00'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black, Impact, sans-serif' font-weight='900' font-style='italic' font-size='200' letter-spacing='-10' fill='%23070707'%3ERGR%3C/text%3E%3C/svg%3E">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#070707',
              card: '#121212',
              border: '#242424',
              neon: '#FF6B00',
              neonDark: '#E05E00',
              muted: '#8E8E93',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #121212;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #242424;
      border-radius: 4px;

  </style>
</head>
<body class="h-full text-white font-sans antialiased bg-[#070707] flex flex-col justify-between custom-scrollbar">

  <!-- APP CONTAINER -->
  <div id="app" class="min-h-screen flex flex-col max-w-md mx-auto w-full bg-[#070707] shadow-2xl relative border-x border-[#1A1A1A]">

    <!-- HEADER BRANDING -->
    <header class="sticky top-0 z-40 bg-[#070707]/90 backdrop-blur-md border-b border-brand-border px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-brand-neon flex items-center justify-center font-black text-black tracking-tighter text-xl italic shadow-[0_0_15px_rgba(255,107,0,0.4)]">
          RGR
        </div>
        <div>
          <h1 class="font-black italic tracking-wider text-lg leading-none uppercase text-white">
            RUN<span class="text-brand-neon">GIGI</span>RUN
          </h1>
          <p class="text-[10px] text-brand-muted tracking-widest uppercase font-mono mt-0.5">Istruttore Running</p>
        </div>
      </div>
      <div id="userBadge" class="hidden items-center gap-2">
        <span id="roleTag" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-brand-card border border-brand-border text-brand-neon"></span>
        <button onclick="handleLogout()" class="px-3 py-1.5 text-xs bg-brand-card border border-brand-border text-brand-muted hover:text-white rounded-lg transition font-mono">
          Esci
        </button>
      </div>
    </header>

    <!-- MAIN VIEW AREA -->
    <main class="flex-1 p-4 pb-10">

      <!-- AUTH CONTAINER -->
      <section id="authSection" class="flex flex-col justify-center min-h-[75vh]">
        <div class="text-center mb-8">
          <h2 id="authTitle" class="text-2xl font-black uppercase italic tracking-wide">Accedi</h2>
          <p class="text-xs text-brand-muted mt-1">Gestione Allenamenti - Rungigirun</p>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs uppercase font-mono text-brand-muted mb-1">Email</label>
            <input type="email" id="authEmail" required class="w-full bg-brand-card border border-brand-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-neon transition" placeholder="atleta@rungigirun.it">
          </div>

          <div>
            <label class="block text-xs uppercase font-mono text-brand-muted mb-1">Password</label>
            <div class="relative">
              <input type="password" id="authPassword" required class="w-full bg-brand-card border border-brand-border rounded-xl pl-4 pr-16 py-3 text-sm focus:outline-none focus:border-brand-neon transition" placeholder="••••••••">
              <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-mono text-brand-muted hover:text-white transition py-1 px-2">
                Mostra
              </button>
            </div>
            <div class="flex justify-end mt-1">
              <button type="button" onclick="handleForgotPassword()" class="text-[11px] text-brand-muted hover:text-brand-neon transition font-mono">
                Password dimenticata?
              </button>
            </div>
          </div>

          <!-- ROLE SELECTOR (SIGNUP ONLY) -->
          <div id="roleSelectorGroup" class="hidden space-y-3">
            <label class="block text-xs uppercase font-mono text-brand-muted mb-1">Tipo Profilo</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="userRole" value="athlete" checked onchange="handleRoleChange()" class="peer sr-only">
                <div class="p-3 text-center rounded-xl bg-brand-card border border-brand-border text-xs font-bold uppercase peer-checked:border-brand-neon peer-checked:text-brand-neon transition">
                  Atleta
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="userRole" value="coach" onchange="handleRoleChange()" class="peer sr-only">
                <div class="p-3 text-center rounded-xl bg-brand-card border border-brand-border text-xs font-bold uppercase peer-checked:border-brand-neon peer-checked:text-brand-neon transition">
                  Coach Gigi
                </div>
              </label>
            </div>

            <!-- PIN SEGRETO COACH -->
            <div id="coachPinGroup" class="hidden pt-1">
              <label class="block text-xs uppercase font-mono text-brand-neon mb-1">Codice Segreto Coach</label>
              <input type="password" id="coachPinInput" class="w-full bg-brand-card border border-brand-neon/50 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-neon transition" placeholder="Inserisci il PIN Coach">
              <p class="text-[10px] text-brand-muted mt-1">Necessario per registrarsi come Coach.</p>
            </div>
          </div>

          <button type="submit" id="authSubmitBtn" class="w-full bg-brand-neon hover:bg-brand-neonDark text-black font-black uppercase py-3.5 rounded-xl transition shadow-[0_0_20px_rgba(255,107,0,0.3)] tracking-wider mt-2">
            Accedi
          </button>
        </form>

        <div class="text-center mt-6">
          <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-xs text-brand-muted hover:text-white underline font-mono">
            Non hai un account? Registrati
          </button>
        </div>
      </section>

      <!-- COACH DASHBOARD -->
      <section id="coachDashboard" class="hidden space-y
